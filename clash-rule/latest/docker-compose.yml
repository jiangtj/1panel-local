services:
  clash-rule-web:
    image: nginx:alpine
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:80"
    volumes:
      - ./data/acl4ssr/Clash:/usr/share/nginx/html
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      createdBy: Apps
  rule-updater:
    image: alpine:3.20
    container_name: "${CONTAINER_NAME}-rule-updater"
    restart: always
    networks:
      - 1panel-network
    environment:
      RULE_HOST: "${RULE_HOST}"
      RULE_PORT: "${PANEL_APP_PORT_HTTP}"
    volumes:
      - ./data/acl4ssr:/data/acl4ssr
      - ./scripts/update-rule-cron.sh:/scripts/update-rule-cron.sh:ro
    command: "/scripts/update-rule-cron.sh install"
    entrypoint: /bin/sh
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      createdBy: Apps
networks:
  1panel-network:
    external: true
