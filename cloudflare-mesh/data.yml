name: Cloudflare Mesh
tags:
  - Network
  - Tool
title: "Cloudflare Mesh - Cloudflare 组网节点"
description: "以 Docker 方式运行 Cloudflare Mesh 节点，把服务器接入 Cloudflare Mesh 网络，并作为转发网关为其他设备提供出网能力。"
additionalProperties:
  key: cloudflare-mesh
  name: Cloudflare Mesh
  tags:
    - Network
    - Tool
  shortDescZh: "把服务器接入 Cloudflare Mesh 网络的组网节点"
  shortDescEn: "Join the server to a Cloudflare Mesh network as a node"
  description:
    en: "Runs a Cloudflare Mesh node in Docker. The node joins the server to a Cloudflare Mesh network with its node token and, with source NAT and IPv4/IPv6 forwarding enabled, can also act as a gateway that lets other devices reach the mesh. This app adds the network capabilities, the TUN device and the forwarding sysctls the node needs."
    es-es: "Ejecuta un nodo de Cloudflare Mesh en Docker. El nodo une el servidor a una red de Cloudflare Mesh mediante su token y, con NAT de origen y reenvio IPv4/IPv6 activados, tambien puede actuar como puerta de enlace para que otros dispositivos alcancen la malla. Esta aplicacion anade las capacidades de red, el dispositivo TUN y los sysctl de reenvio que el nodo necesita."
    ja: "Cloudflare Mesh ノードを Docker で実行します。ノードはノードトークンを使ってサーバーを Cloudflare Mesh ネットワークに参加させ、送信元 NAT と IPv4/IPv6 転送を有効にすると、他の機器をメッシュへ接続させるゲートウェイとしても動作します。本アプリはノードに必要なネットワーク権限、TUN デバイス、転送 sysctl を付与します。"
    ms: "Menjalankan nod Cloudflare Mesh dalam Docker. Nod ini menyertakan pelayan ke rangkaian Cloudflare Mesh menggunakan token nod dan, dengan NAT sumber serta penghantaran IPv4/IPv6 dihidupkan, boleh bertindak sebagai gerbang yang membolehkan peranti lain mencapai mesh. Aplikasi ini menambah keupayaan rangkaian, peranti TUN dan sysctl penghantaran yang diperlukan nod."
    pt-br: "Executa um no do Cloudflare Mesh no Docker. O no conecta o servidor a uma rede Cloudflare Mesh usando seu token e, com NAT de origem e encaminhamento IPv4/IPv6 habilitados, tambem pode atuar como gateway para outros dispositivos alcancarem a malha. Este aplicativo adiciona as capacidades de rede, o dispositivo TUN e os sysctl de encaminhamento necessarios."
    ru: "Запускает узел Cloudflare Mesh в Docker. Узел подключает сервер к сети Cloudflare Mesh по токену узла и, при включенных source NAT и перенаправлении IPv4/IPv6, может работать как шлюз, через который другие устройства получают доступ к сети. Приложение добавляет сетевые возможности, устройство TUN и sysctl перенаправления, необходимые узлу."
    ko: "Cloudflare Mesh 노드를 Docker로 실행합니다. 노드는 노드 토큰으로 서버를 Cloudflare Mesh 네트워크에 연결하며, 소스 NAT와 IPv4/IPv6 포워딩을 켜면 다른 장치가 메시에 접근할 수 있는 게이트웨이 역할도 합니다. 이 앱은 노드에 필요한 네트워크 권한, TUN 장치, 포워딩 sysctl을 부여합니다."
    zh-Hant: "以 Docker 方式執行 Cloudflare Mesh 節點，把伺服器接入 Cloudflare Mesh 網路，並在開啟來源 NAT 與 IPv4/IPv6 轉送後，作為閘道讓其他裝置存取網狀網路。本應用會為節點加上所需的網路權限、TUN 裝置與轉送 sysctl。"
    zh: "以 Docker 方式运行 Cloudflare Mesh 节点，把服务器接入 Cloudflare Mesh 网络，并在开启源地址 NAT 与 IPv4/IPv6 转发后，作为网关让其他设备访问网状网络。本应用会为节点加上所需的网络权限、TUN 设备与转发 sysctl。"
    tr: "Cloudflare Mesh dugumunu Docker icinde calistirir. Dugum, dugum belirteci ile sunucuyu bir Cloudflare Mesh agina baglar; kaynak NAT ve IPv4/IPv6 yonlendirme acikken diger cihazlarin mesh agina erismesini saglayan bir ag gecidi olarak da calisir. Bu uygulama dugumun ihtiyac duydugu ag yetkilerini, TUN aygitini ve yonlendirme sysctl ayarlarini ekler."
  type: tool
