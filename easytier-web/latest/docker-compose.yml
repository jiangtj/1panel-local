services:
  easytier-web:
    image: easytier/easytier:latest
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:11211"
      - "${PANEL_APP_PORT_CONFIG}:22020/udp"
    environment:
      TZ: Asia/Shanghai
      API_HOST: "${API_HOST}"
      HOST_IP: "${HOST_IP}"
      PANEL_APP_PORT_HTTP: "${PANEL_APP_PORT_HTTP}"
    volumes:
      - ./data:/data
    entrypoint:
      - /sbin/tini
      - "--"
      - /bin/sh
      - -c
    command:
      - >-
        exec easytier-web-embed --api-server-port 11211
        --api-host "$${API_HOST:-http://$$HOST_IP:$$PANEL_APP_PORT_HTTP}"
        --config-server-port 22020 --config-server-protocol udp --db /data/et.db
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:11211/ || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      createdBy: "Apps"
      com.centurylinklabs.watchtower.enable: "true"
      watchcow.enable: "true"
      watchcow.title: "EasyTier Web"
      watchcow.service_port: "${PANEL_APP_PORT_HTTP}"
      watchcow.icon: "file:///opt/1panel/resource/apps/local/easytier-web/logo.png"
networks:
  1panel-network:
    external: true
