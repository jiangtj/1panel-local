services:
  fast-note-sync:
    # 上游只发布 latest 与具体版本号两类 tag，本应用按需固定跟随 latest
    image: haierkeys/fast-note-sync-service:latest
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:9000
    volumes:
      - ./storage:/fast-note-sync/storage  # 笔记数据库、附件、日志
      - ./config:/fast-note-sync/config     # 配置文件 config.yaml
    labels:
      createdBy: "Apps"
      com.centurylinklabs.watchtower.enable: 'true'
      watchcow.enable: "true"
      watchcow.title: "Fast Note Sync"
      watchcow.service_port: "${PANEL_APP_PORT_HTTP}"
      watchcow.icon: "file:///opt/1panel/resource/apps/local/fns/logo.png"

networks:
  1panel-network:
    external: true