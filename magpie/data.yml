title: "magpie - 多 Agent 模型网关"
description: "magpie 在本地运行一个网关，同时支持 OpenAI、Anthropic 和 Gemini 三种 API 并互相转换，让任何编码 Agent 都能使用任意厂商的模型。本应用以 Docker 方式运行 magpie 网关及其 Web 界面，并可在浏览器中管理。"
additionalProperties:
  key: magpie
  name: Magpie
  tags:
    - AI
    - Tool
  shortDescZh: "多 Agent 统一的模型网关，支持 OpenAI / Anthropic / Gemini 互转"
  shortDescEn: "One local gateway that lets any coding agent use any provider's model"
  description:
    en: "magpie runs a local gateway that speaks the OpenAI, Anthropic and Gemini APIs and translates between them, so any coding agent can use any provider's model. This app runs the magpie gateway together with its web UI in Docker, and manages it from the browser."
    es-es: "magpie ejecuta una pasarela local compatible con las API de OpenAI, Anthropic y Gemini y traduce entre ellas, de modo que cualquier agente de programacion puede usar el modelo de cualquier proveedor. Esta aplicacion ejecuta la pasarela de magpie y su interfaz web en Docker, y se administra desde el navegador."
    ja: "magpie はローカルでゲートウェイを動かし、OpenAI・Anthropic・Gemini の各 API に対応して相互に変換します。これにより任意のコーディングエージェントが任意のプロバイダーのモデルを利用できます。本アプリは magpie ゲートウェイと Web UI を Docker で実行し、ブラウザから管理できます。"
    ms: "magpie menjalankan gerbang setempat yang menyokong API OpenAI, Anthropic dan Gemini serta menterjemah antaranya, jadi mana-mana agen boleh menggunakan model mana-mana penyedia. Aplikasi ini menjalankan gerbang magpie dan antara muka webnya dalam Docker, dan diurus dari pelayar."
    pt-br: "O magpie executa um gateway local compatível com as APIs OpenAI, Anthropic e Gemini e converte entre elas, para que qualquer agente de programação use o modelo de qualquer provedor. Este aplicativo executa o gateway do magpie e sua interface web no Docker, com gerenciamento pelo navegador."
    ru: "magpie запускает локальный шлюз, поддерживающий API OpenAI, Anthropic и Gemini с взаимным преобразованием, поэтому любой агент может использовать модель любого провайдера. Это приложение запускает шлюз magpie и его веб-интерфейс в Docker и управляется из браузера."
    ko: "magpie는 로컬에서 게이트웨이를 실행하며 OpenAI, Anthropic, Gemini API를 지원하고 상호 변환합니다. 이를 통해 모든 코딩 에이전트가 원하는 공급자의 모델을 사용할 수 있습니다. 이 앱은 magpie 게이트웨이와 웹 UI를 Docker로 실행하며 브라우저에서 관리합니다."
    zh-Hant: "magpie 在本機執行一個閘道，同時支援 OpenAI、Anthropic 與 Gemini 三種 API 並互相轉換，讓任何編碼 Agent 都能使用任意廠商的模型。本應用以 Docker 方式執行 magpie 閘道及其網頁介面，並可從瀏覽器管理。"
    zh: "magpie 在本地运行一个网关，同时支持 OpenAI、Anthropic 和 Gemini 三种 API 并互相转换，让任何编码 Agent 都能使用任意厂商的模型。本应用以 Docker 方式运行 magpie 网关及其 Web 界面，并可在浏览器中管理。"
    tr: "magpie, OpenAI, Anthropic ve Gemini API'lerini destekleyen ve aralarinda donusum yapan yerel bir ag gecidi calistirir; boylece herhangi bir kodlama ajani herhangi bir saglayicinin modelini kullanabilir. Bu uygulama magpie ag gecidini ve web arayuzunu Docker'da calistirir ve tarayicidan yonetilir."
