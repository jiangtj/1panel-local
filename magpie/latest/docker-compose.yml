services:
  magpie:
    image: ghcr.io/yetone/magpie:latest
    container_name: "${CONTAINER_NAME}"
    restart: always
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:3430"
      - "${PANEL_APP_PORT_GATEWAY}:3425"
    environment:
      MAGPIE_PUBLIC_URL: "${MAGPIE_PUBLIC_URL}"
      MAGPIE_WEB_KEY: "${MAGPIE_WEB_KEY}"
    volumes:
      - ./config:/config
    command:
      - web
      - "--addr"
      - 0.0.0.0:3430
      - "--no-open"
    labels:
      createdBy: Apps
      com.centurylinklabs.watchtower.enable: "true"
      watchcow.enable: "true"
      watchcow.title: "Magpie"
      watchcow.service_port: "${PANEL_APP_PORT_HTTP}"
      watchcow.path: "/?k=${MAGPIE_WEB_KEY}"
      watchcow.icon: "file:///opt/1panel/resource/apps/local/magpie/logo.png"
networks:
  1panel-network:
    external: true
